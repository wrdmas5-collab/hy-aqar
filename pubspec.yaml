name: hy_academy
description: "HY Academy Application with FCM Push Notifications & Google Auth."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.0
  cached_network_image: ^3.4.1
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  http: ^1.3.0
  shared_preferences: ^2.5.2
  youtube_player_iframe: ^6.0.2
  video_player: ^2.9.2
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  file_picker: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.jpg"
  web:
    generate: true
    image_path: "assets/icon/icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpg
    - assets/images/university.jpg