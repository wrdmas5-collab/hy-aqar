name: hy_academy
description: "HY Academy Application with FCM Push Notifications & Google Auth."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.0
  cached_network_image: ^3.4.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  youtube_player_iframe: ^6.0.2
  video_player: ^2.8.6
  firebase_storage: ^12.3.0
  image_picker: ^1.1.2
    file_picker: ^8.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.jpg"
  web:
    generate: true
    image_path: "assets/icon/icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpg
    - assets/images/university.jpg
