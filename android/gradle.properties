org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable AAR metadata checks completely (required for AGP 9+)
android.injected.checkAarMetadata=false
android.aarMetadata.check=false
android.disableAarMetadataCheck=true

# Disable new DSL to keep compatibility with kotlin-android plugin
android.newDsl=false
android.builtInKotlin=false
